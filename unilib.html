<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="description" content="university library for SAMS"/>
    <link rel="stylesheet" href="unilib.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <title>University Library</title>
</head>
<body>
    <header>
        <div class="navbar">
            
            <img alt="logo" src="http://sams.edu.eg/images/sams_logo.png">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-bar" placeholder="Search Books...">
                <button id="searchButton" class="search-button">
                    <i class="fa fa-search"></i>
                </button>
            </div>
            <div class="nav-menu">
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                    <li><a href="booking.html">Booking</a></li>
                    <li>
                        <button id="langToggle" class="lang-toggle">
                            <span class="lang-text">العربية</span>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <div class="content" id="bookResults">
        <!-- Book results will be displayed here -->
        <h2>Library Collection</h2>
        <!-- Add after the h2 title -->
<div class="filter-controls">
    <select id="genreFilter" class="filter-select">
        <option value="">All Genres</option>
        <option value="Fiction">Fiction</option>
        <option value="Science Fiction">Science Fiction</option>
        <option value="Fantasy">Fantasy</option>
        <option value="Mystery">Mystery</option>
        <option value="Thriller">Thriller</option>
        <option value="Romance">Romance</option>
        <option value="Non-Fiction">Non-Fiction</option>
        <option value="Biography">Biography</option>
        <option value="History">History</option>
        <option value="Science">Science</option>
        <option value="Technology">Technology</option>
        <option value="Philosophy">Philosophy</option>
        <option value="Psychology">Psychology</option>
        <option value="Business">Business</option>
        <option value="Art">Art</option>
    </select>
    
    <select id="sortBy" class="filter-select">
        <option value="title">Sort by Title</option>
        <option value="author">Sort by Author</option>
        <option value="year">Sort by Year</option>
    </select>
</div>
        <div id="booksList" class="books-grid">
            <!-- Books will be loaded here -->
            <p>Start searching or browse our collection below</p>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; SAMS Academy. All rights reserved.</p>
        <div class="footer-links">
            <a href="#" data-translate="privacy">Privacy Policy</a>
            <a href="#" data-translate="terms">Terms of Service</a>
            <a href="#" data-translate="contact">Contact Us</a>
        </div>
    </footer>

    <script src="library.js"></script>
</body>
</html>
