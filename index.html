<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="university library for SAMS"/>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <title data-translate="title">University Library</title>
</head>
<body>
    <header>
        <div class="navbar">
            <img alt="logo" src="http://sams.edu.eg/images/sams_logo.png">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-bar" data-translate="search" placeholder="Search Books...">
                <button id="searchButton" class="search-button">
                    <i class="fa fa-search"></i>
                </button>
            </div>
            <div class="nav-menu">
                <ul>
                    <li><a href="#" data-translate="home">Home</a></li>
                    <li><a href="contact.html" data-translate="contact">Contact Us</a></li>
                    <li><a href="#" data-translate="booking">Booking</a></li>
                </ul>
            </div>
            <div class="language-selector">
                <button onclick="changeLanguage('en')">English</button>
                <button onclick="changeLanguage('ar')">العربية</button>
            </div>
        </div>
    </header>

    <main class="content" dir="auto">
        <h2 data-translate="libraryCollection">Library Collection</h2>
        
        <div class="filters">
            <select id="genreFilter" class="filter-select">
                <option value="" data-translate="allGenres">All Genres</option>
                <option value="Science Fiction">Science Fiction</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Non-Fiction">Non-Fiction</option>
            </select>
            
            <select id="sortBy" class="filter-select">
                <option value="title" data-translate="sortByTitle">Sort by Title</option>
                <option value="author">Sort by Author</option>
                <option value="year">Sort by Year</option>
            </select>
        </div>

        <div id="booksList" class="books-grid">
        </div>
    </main>

    <footer class="footer">
        <p>&copy; SAMS Academy. All rights reserved.</p>
        <div class="footer-links">
            <a href="#" data-translate="privacy">Privacy Policy</a>
            <a href="#" data-translate="terms">Terms of Service</a>
            <a href="#" data-translate="contact">Contact Us</a>
        </div>
    </footer>

    <script src="js/translations.js"></script>
    <script src="js/library.js"></script>
</body>
</html>
