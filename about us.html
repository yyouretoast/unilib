<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Website</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="about us.CSS">
</head>
<body>
    <section class="contact">
        <div class="content">
            <h2>Contact Us</h2>
        </div>

        <div class="container">
            <div class="contact-info">
                <div class="box">
                    <div class="icon">
                        <i class="fa fa-map-marker" aria-hidden="true"></i>
                    </div>
                  
                    <div class="text">
                        <h3>Address</h3>
                        <p>Nile Corniche, Maadi Entrance No. (1) - Cairo</p>
                    </div>
                </div>
               
                <div class="box">
                    <div class="icon">
                        <i class="fa fa-phone" aria-hidden="true"></i>
                    </div>
                 
                    <div class="text">
                        <h3>Phone</h3>
                        <p>23787630 – 23581033</p>
                    </div>
                </div>
               
                <div class="box">
                    <div class="icon">
                        <i class="fa fa-envelope" aria-hidden="true"></i>
                    </div>
               
                    <div class="text">
                        <h3>Email</h3>
                        <p>info@sadatacademy.edu.eg</p>
                    </div>
                </div>
            </div>
         
            <div class="contact-info">
                <form>
                    <h2>Send Message</h2>
                  
                    <div class="inputbox">
                        <span>Name</span>
                        <input type="text" name="" required="required">
                    </div>
                  
                    <div class="inputbox">
                        <span>Email</span>
                        <input type="text" name="" required="required">
                    </div>
                 
                    <div class="inputbox">
                        <span>Type your message</span>
                        <input type="text"message="" required="required">
                    </div>
                    <button type="button">Send</button>
                </form>
            </div>
        </div>
    </section>
    <footer>
        <p>Follow us on:</p>
        <div class="social-icons">
            <a href="https://www.facebook.com/sams.edu.eg" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/124/124010.png" alt="Facebook">
            </a>
            <a href="https://www.twitter.com/sadatacademy" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter">
            </a>
            <a href="https://www.instagram.com/sadatacademy" target="_blank">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram">
            </a>
        </div>
    </footer>
</body>
</html>
