<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="bookManager.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="user-info">
                <img src="default-avatar.jpg" alt="User Avatar" class="avatar">
                <h3 id="userName">Loading...</h3>
                <p id="userRole">Student</p>
            </div>
            <nav class="dashboard-nav">
                <a href="#overview" class="active"><i class="fas fa-home"></i> Overview</a>
                <a href="#borrowed"><i class="fas fa-book"></i> Borrowed Books</a>
                <a href="#reservations"><i class="fas fa-bookmark"></i> Reservations</a>
                <a href="#history"><i class="fas fa-history"></i> History</a>
                <a href="#profile"><i class="fas fa-user"></i> Profile</a>
                <a href="#notifications"><i class="fas fa-bell"></i> Notifications</a>
                <a href="#books"><i class="fas fa-book-open"></i> Manage Books</a>
            </nav>
            <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header">
                <h2>Welcome Back, <span id="userGreeting">User</span>!</h2>
                <div class="header-actions">
                    <button id="notificationBtn" class="icon-btn">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge">0</span>
                    </button>
                </div>
            </header>

            <div class="dashboard-content">
                <section id="overview" class="dashboard-section active">
                    <div class="stats-grid">
                        <div class="stat-card">
                            <h3>Currently Borrowed</h3>
                            <p id="borrowedCount">0</p>
                        </div>
                        <div class="stat-card">
                            <h3>Reservations</h3>
                            <p id="reservationsCount">0</p>
                        </div>
                        <div class="stat-card">
                            <h3>Due Soon</h3>
                            <p id="dueSoonCount">0</p>
                        </div>
                    </div>

                    <div class="recent-activity">
                        <h3>Recent Activity</h3>
                        <div id="activityList" class="activity-list">
                            <!-- Activities will be loaded here -->
                        </div>
                    </div>
                </section>

                <section id="books" class="dashboard-section">
                    <h2>Book Management</h2>
                    <button class="btn-primary" onclick="document.getElementById('addBookModal').style.display='block'">
                        Add New Book
                    </button>
                    
                    <div id="booksList" class="books-grid">
                        <!-- Books will be loaded here -->
                    </div>

                    <!-- Add Book Modal -->
                    <div id="addBookModal" class="modal">
                        <div class="modal-content">
                            <span class="close-modal">&times;</span>
                            <h3>Add New Book</h3>
                            <form id="addBookForm">
                                <div class="form-group">
                                    <label for="title">Title*</label>
                                    <input type="text" id="title" name="title" required>
                                </div>
                                <div class="form-group">
                                    <label for="author">Author*</label>
                                    <input type="text" id="author" name="author" required>
                                </div>
                                <div class="form-group">
                                    <label for="isbn">ISBN*</label>
                                    <input type="text" id="isbn" name="isbn" required>
                                </div>
                                <div class="form-group">
                                    <label for="publication_year">Publication Year</label>
                                    <input type="number" id="publication_year" name="publication_year">
                                </div>
                                <div class="form-group">
                                    <label for="quantity">Quantity*</label>
                                    <input type="number" id="quantity" name="quantity" required min="0">
                                </div>
                                <div class="form-group">
                                    <label for="genre">Genre</label>
                                    <input type="text" id="genre" name="genre">
                                </div>
                                <div class="form-group">
                                    <label for="description">Description</label>
                                    <textarea id="description" name="description" rows="3"></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="language">Language</label>
                                    <input type="text" id="language" name="language" value="English">
                                </div>
                                <div class="form-group">
                                    <label for="publisher">Publisher</label>
                                    <input type="text" id="publisher" name="publisher">
                                </div>
                                <div class="form-group">
                                    <label for="page_count">Page Count</label>
                                    <input type="number" id="page_count" name="page_count" min="0">
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="btn-primary">Add Book</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Edit Book Modal -->
                    <div id="editModal" class="modal">
                        <div class="modal-content">
                            <span class="close-modal">&times;</span>
                            <h3>Edit Book</h3>
                            <form id="editBookForm">
                                <input type="hidden" id="editBookId" name="book_id">
                                <div class="form-group">
                                    <label for="editTitle">Title*</label>
                                    <input type="text" id="editTitle" name="title" required>
                                </div>
                                <div class="form-group">
                                    <label for="editAuthor">Author*</label>
                                    <input type="text" id="editAuthor" name="author" required>
                                </div>
                                <div class="form-group">
                                    <label for="editIsbn">ISBN*</label>
                                    <input type="text" id="editIsbn" name="isbn" required>
                                </div>
                                <div class="form-group">
                                    <label for="editPublicationYear">Publication Year</label>
                                    <input type="number" id="editPublicationYear" name="publication_year">
                                </div>
                                <div class="form-group">
                                    <label for="editQuantity">Quantity*</label>
                                    <input type="number" id="editQuantity" name="quantity" required min="0">
                                </div>
                                <div class="form-group">
                                    <label for="editGenre">Genre</label>
                                    <input type="text" id="editGenre" name="genre">
                                </div>
                                <div class="form-group">
                                    <label for="editDescription">Description</label>
                                    <textarea id="editDescription" name="description" rows="3"></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="editLanguage">Language</label>
                                    <input type="text" id="editLanguage" name="language">
                                </div>
                                <div class="form-group">
                                    <label for="editPublisher">Publisher</label>
                                    <input type="text" id="editPublisher" name="publisher">
                                </div>
                                <div class="form-group">
                                    <label for="editPageCount">Page Count</label>
                                    <input type="number" id="editPageCount" name="page_count" min="0">
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="btn-primary">Update Book</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <script src="dashboard.js"></script>
    <script src="bookManager.js"></script>
</body>
</html>
