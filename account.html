<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="account.css">
    <title>account</title>
    </head>
<body>
<div class="main">
<input type="checkbox" id="chk" aria-hidden="true">
<div class="signup">
<form>
<label for ="chk" aria-hidden="true">sign up</label>
<input type="text"name="txt" placeholder="user name"required="">
<input type="email"email="txt" placeholder="email"required="">
<input type="password"name="txt" placeholder="password"required="">
<button>sign up</button>
</form>
</div>

<div class="login">
<form>
    <label for ="chk" aria-hidden="true">login </label>
    <input type="text"email="txt" placeholder="email"required="">
    <input type="text"name="txt" placeholder="password"required="">
    <button>Login</button>

</form>
</div>
</div>
</body>
</html>
