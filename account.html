<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Sans+Pro:wght@300;400;600&family=Lora:wght@400;500&display=swap">
    <link rel="stylesheet" href="account.css">
    <title>Library Account</title>
</head>
<body>
    <div class="main">
        <input type="checkbox" id="chk" aria-hidden="true">
        <div class="signup">
            <form id="signupForm">
                <label for="chk" aria-hidden="true">Sign up</label>
                <input type="text" id="signupUsername" name="username" placeholder="Username" required>
                <input type="email" id="signupEmail" name="email" placeholder="Email" required>
                <input type="password" id="signupPassword" name="password" placeholder="Password" required>
                <button type="submit">Sign up</button>
                <div id="signupStatus" class="status-message"></div>
            </form>
        </div>

        <div class="login">
            <form id="loginForm">
                <label for="chk" aria-hidden="true">Login</label>
                <input type="text" id="loginUsername" name="username" placeholder="Username" required>
                <input type="password" id="loginPassword" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
                <div id="loginStatus" class="status-message"></div>
            </form>
        </div>
    </div>
    <div class="back-to-home">
        <a href="home.html">Back to Home</a>
    </div>
    <script src="account.js"></script> 
    <footer class="footer">
        <p>&copy; SAMS Academy. All rights reserved.</p>
        <div class="footer-links">
            <a href="#" data-translate="privacy">Privacy Policy</a>
            <a href="#" data-translate="terms">Terms of Service</a>
            <a href="#" data-translate="contact">Contact Us</a>
        </div>
    </footer>
</body>
</html>
